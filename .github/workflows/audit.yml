name: Audit

# Dependency licences, security advisories and sources.
#
# On a schedule as well as on changes, because this is the one check whose
# result can turn red without anybody touching the repository: an advisory
# published against a crate already in the lock file makes a passing commit
# vulnerable retroactively.
on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  schedule:
    # Mondays, early UTC. Nothing here depends on the exact time.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Reads the lock file and the advisory database; writes nothing back.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just,cargo-deny

      - run: just audit
