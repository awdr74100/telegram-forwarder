[package]
name = "telegram-forwarder"
version = "0.1.0"
edition = "2024"
# Equal to the channel in `rust-toolchain.toml`, deliberately. That file makes
# every build from source use this exact version, so a lower figure here would be
# a minimum nothing ever compiles against and nothing would notice going stale.
# `helix` resolves it the same way; `uv` and `ruff` keep a gap, but they publish
# libraries to crates.io where the number is load-bearing, and this ships as a
# prebuilt binary where it is not.
rust-version = "1.98.1"
description = "Many-to-many Telegram forwarder: route any number of chats into any number of others, each with its own filter and delivery mode"
authors = ["Roya <a78945612385238@gmail.com>"]
license = "MIT"
repository = "https://github.com/awdr74100/telegram-forwarder"
keywords = ["telegram", "mtproto", "forwarder", "cli"]
categories = ["command-line-utilities"]

# Not published to crates.io: installing this would mean asking a user to have a
# Rust toolchain and then wait through a build, when the whole point of shipping
# a single static binary is that they need neither. Distribution is the GitHub
# Release and the installer scripts. This flag makes an accidental `cargo
# publish` fail rather than succeed.
publish = false

# `publish = false` also hides the package from `dist`, which reads it as "not
# for distribution" rather than "not for crates.io". This says which of the two
# was meant.
[package.metadata.dist]
dist = true

[[bin]]
name = "tgfwd"
path = "src/main.rs"

[dependencies]
# Telegram MTProto stack.
#
# `grammers-session` is deliberately built with `default-features = false`: the default
# `sqlite-storage` feature drags in `libsql`, and this project persists its session in a
# single JSON file instead (see `src/session`). The `serde` feature is what makes that
# possible, since it derives Serialize/Deserialize on the session's own types.
grammers-client = "0.10"
grammers-session = { version = "0.10", default-features = false, features = ["serde"] }
grammers-tl-types = "0.10"

# Async runtime.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "time",
  "fs",
  "io-util",
] }

# CLI surface.
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
inquire = "0.9"

# Diagnostics.
color-eyre = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"

# Configuration and state.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"
humantime-serde = "1"
directories = "6"
fs-err = "3"

# Runtime plumbing.
dashmap = "6"
chrono = "0.4"
rand = "0.10"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# `unreachable_pub` is deliberately not enabled: this is a binary crate, so every
# `pub` item is unreachable from outside by definition and the lint fires on all
# of them without saying anything useful.

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The codebase is a binary, not a library: documenting every error/panic path on
# private functions is noise rather than signal.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Telegram's API is i32/i64-heavy and casts between them are pervasive and checked
# by context rather than by type.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Delivery futures are large because they carry snapshots and peer references.
# Boxing them would add an allocation on the hot path to save stack that is only
# touched once per message.
large_futures = "allow"
# `skip_serializing_if` requires a `&bool` signature, so the helper cannot take
# its argument by value.
trivially_copy_pass_by_ref = "allow"
# `Paths` fields are all directories; the shared suffix is the point.
struct_field_names = "allow"
# Matching Telegram's payload types explicitly documents which are handled,
# even where two arms currently agree.
match_same_arms = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# `dist` builds the shipped binaries with `--profile dist`, so without this the
# release workflow fails on every platform at once with `profile `dist` is not
# defined` — which is what happened to the first v0.1.0 tag. `dist init` writes
# this section; it was never run here.
#
# Inheriting rather than repeating keeps one definition of how the shipped
# binary is built. `cargo-dist` itself, `uv` and `ruff` all inherit from release
# the same way.
[profile.dist]
inherits = "release"
